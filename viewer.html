<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Просмотр документа</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #f3f3f3; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .toolbar {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      flex-wrap: wrap; flex-shrink: 0; padding: 8px 10px;
      background: #fff; border-bottom: 1px solid #ddd;
    }
    .toolbar button, .toolbar a {
      display: inline-flex; justify-content: center; align-items: center;
      min-width: 40px; min-height: 40px; border: 1px solid #ddd;
      background: #fff; border-radius: 7px; color: #171717;
      font: 600 16px Arial, sans-serif; text-decoration: none; cursor: pointer;
      touch-action: manipulation;
    }
    .toolbar button:disabled { opacity: .35; cursor: default; }
    .toolbar .page-counter { min-width: 75px; font-size: 13px; text-align: center; }
    .toolbar a { padding: 0 12px; font-size: 13px; }
    #viewer {
      flex: 1; min-height: 0; overflow: auto;
      overscroll-behavior: contain; text-align: center;
      -webkit-overflow-scrolling: touch;
    }
    #pageCanvas {
      display: block; max-width: none; margin: 12px auto 24px;
      background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    #message { padding: 40px 15px; color: #444; font-size: 15px; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (max-width: 450px) {
      .toolbar { gap: 5px; padding: 6px; }
      .toolbar button { min-width: 35px; min-height: 38px; }
      .toolbar .page-counter { min-width: 65px; }
      .toolbar a { min-height: 38px; padding: 0 8px; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Управление документом">
    <button id="prevPage" aria-label="Предыдущая страница" disabled>‹</button>
    <span class="page-counter" id="pageCounter">— / —</span>
    <button id="nextPage" aria-label="Следующая страница" disabled>›</button>
    <button id="zoomOut" aria-label="Уменьшить" disabled>−</button>
    <button id="zoomIn" aria-label="Увеличить" disabled>+</button>
    <a id="openFile" href="#" target="_blank" rel="noopener">Скачать ↗</a>
  </nav>
  <main id="viewer">
    <div id="message" role="status">Загружаем документ…</div>
    <canvas id="pageCanvas" hidden aria-label="Страница документа"></canvas>
  </main>

  <script>
    // Допускаем только PDF-файлы из того же каталога, где находится viewer.html.
    const file = new URLSearchParams(location.search).get('file') || '';
    const validFile = /^[a-zA-Z0-9._,-]+\.pdf$/i.test(file) && !file.includes('..');
    const fileUrl = validFile ? new URL(encodeURIComponent(file), location.href).href : '';
    document.getElementById('openFile').href = validFile ? fileUrl : '#';
    if (!validFile) document.getElementById('message').textContent = 'Неверное имя PDF-файла.';
  </script>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

    if (validFile) {
      const viewer = document.getElementById('viewer');
      const canvas = document.getElementById('pageCanvas');
      const message = document.getElementById('message');
      const counter = document.getElementById('pageCounter');
      const prev = document.getElementById('prevPage');
      const next = document.getElementById('nextPage');
      const zoomOut = document.getElementById('zoomOut');
      const zoomIn = document.getElementById('zoomIn');

      let pdf = null;
      let pageNumber = 1;
      let zoom = 1;
      let sequence = 0;
      let activeRender = null;
      let queue = Promise.resolve();
      let resizeTimeout;

      const updateControls = () => {
        const ready = !!pdf;
        counter.textContent = ready ? `${pageNumber} / ${pdf.numPages}` : '— / —';
        prev.disabled = !ready || pageNumber <= 1;
        next.disabled = !ready || pageNumber >= pdf.numPages;
        zoomOut.disabled = !ready || zoom <= 0.65;
        zoomIn.disabled = !ready || zoom >= 2.5;
      };

      async function render(sequenceNumber) {
        if (!pdf || sequenceNumber !== sequence) return;
        const page = await pdf.getPage(pageNumber);
        if (sequenceNumber !== sequence) return;

        const widthAtOne = page.getViewport({ scale: 1 }).width;
        const fitWidth = Math.max(150, viewer.clientWidth - 28);
        const viewport = page.getViewport({ scale: fitWidth / widthAtOne * zoom });
        const resolution = Math.min(
          window.devicePixelRatio || 1,
          2,
          Math.sqrt(6500000 / (viewport.width * viewport.height))
        );
        if (sequenceNumber !== sequence) return;

        canvas.width = Math.max(1, Math.floor(viewport.width * resolution));
        canvas.height = Math.max(1, Math.floor(viewport.height * resolution));
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        canvas.hidden = false;
        message.hidden = true;

        const context = canvas.getContext('2d');
        if (!context) throw new Error('Canvas недоступен');
        activeRender = page.render({
          canvasContext: context,
          viewport,
          transform: resolution !== 1 ? [resolution, 0, 0, resolution, 0, 0] : null
        });
        try {
          await activeRender.promise;
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') throw error;
        } finally {
          activeRender = null;
        }
      }

      function requestRender() {
        const current = ++sequence;
        if (activeRender) activeRender.cancel();
        queue = queue.catch(() => {}).then(() => render(current)).catch(error => {
          message.hidden = false;
          message.textContent = 'Не удалось отобразить страницу. Нажмите «Скачать», чтобы открыть PDF отдельно.';
          console.error('Ошибка PDF.js:', error);
        });
      }

      function changePage(delta) {
        if (!pdf) return;
        const target = Math.max(1, Math.min(pdf.numPages, pageNumber + delta));
        if (target === pageNumber) return;
        pageNumber = target;
        viewer.scrollTop = 0;
        viewer.scrollLeft = 0;
        updateControls();
        requestRender();
      }

      prev.addEventListener('click', () => changePage(-1));
      next.addEventListener('click', () => changePage(1));
      zoomOut.addEventListener('click', () => {
        zoom = Math.max(0.6, Math.round((zoom - 0.2) * 10) / 10);
        updateControls(); requestRender();
      });
      zoomIn.addEventListener('click', () => {
        zoom = Math.min(2.6, Math.round((zoom + 0.2) * 10) / 10);
        updateControls(); requestRender();
      });

      // На телефоне листать страницы можно также горизонтальным свайпом.
      let startX = 0, startY = 0;
      viewer.addEventListener('touchstart', event => {
        if (event.touches.length !== 1) return;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }, { passive: true });
      viewer.addEventListener('touchend', event => {
        if (event.changedTouches.length !== 1) return;
        const dx = event.changedTouches[0].clientX - startX;
        const dy = event.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 90 && Math.abs(dx) > 1.8 * Math.abs(dy)) {
          changePage(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => { if (pdf) requestRender(); }, 200);
      });

      try {
        const loadingTask = pdfjsLib.getDocument({ url: fileUrl });
        pdf = await loadingTask.promise;
        updateControls();
        requestRender();
      } catch (error) {
        message.hidden = false;
        message.textContent = 'Не удалось загрузить PDF. Проверьте имя файла и попробуйте открыть его по кнопке «Скачать».';
        console.error('Ошибка загрузки PDF:', error);
      }
    }
  </script>
</body>
</html>
